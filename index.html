<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>clearance-repair-lab — certificate-driven minimal separation</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #c9d1d9; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { padding: 16px; overflow-y: auto; border-right: 1px solid #30363d; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #58a6ff; }
  p.lead { color: #8b949e; margin: 0 0 14px; }
  label { display: block; margin: 10px 0 4px; color: #8b949e; }
  select, input[type=range], button { width: 100%; font: inherit; }
  select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px; }
  button { cursor: pointer; margin-top: 12px; background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.ghost { background: #161b22; border-color: #30363d; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid #21262d; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .dim { color: #8b949e; }
  #canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; top: 12px; right: 12px; background: #161b22cc; border: 1px solid #30363d;
         border-radius: 6px; padding: 10px 12px; min-width: 260px; }
  #hud b { color: #58a6ff; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>clearance-repair-lab</h1>
    <p class="lead">Sound interval certificate → minimum-norm separation repair → certificate again. The numbers below are recomputed in your browser with the same <code>src/core.mjs</code> that <code>bench/verify.mjs</code> runs in node, then compared with <code>data/reference.json</code> baked by node.</p>
    <label for="case">Contact scene</label>
    <select id="case"></select>
    <label for="target">Required clearance <span id="tv"></span></label>
    <input id="target" type="range" min="1" max="120" step="1" />
    <button id="repair">Repair (certify → move → certify)</button>
    <button id="reset" class="ghost">Reset to original pose</button>
    <table id="tbl"></table>
  </aside>
  <div style="position:relative">
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
